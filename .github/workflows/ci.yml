name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_pipeline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # jest.setup.js refuses any database whose name lacks "test".
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_pipeline_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_pipeline_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/job_pipeline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # Placeholders: the build validates env shape but never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DASHBOARD_PASSWORD: ci-password
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      # postinstall runs `npm run prisma:generate` (copies ../server/prisma/schema.prisma).
      - run: npm ci
      - run: npm run lint
      # next typegen writes the route types (LayoutProps, PageProps) tsc needs on a clean tree.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
